[package]
name = "rudroid-unity-loader"
version = "0.0.0"
edition = "2021"
license-file.workspace = true
publish = false
description = "Thin Unity Project CLI over the engine-agnostic host kernel"

[[bin]]
name = "rudroid-unity-loader"
path = "src/main.rs"

[[bin]]
name = "rudroid-loader"
path = "src/bin/rudroid-loader.rs"

[dependencies]
rudroid-host-core = { path = "../../host" }
rudroid-common = { path = "../../common" }
rudroid-host-config = { path = "../../common/host-config" }

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Test-only: inspect the temporary preference file using the already locked
# JSON implementation, independently of the runtime's string-copy helper.
serde_json = "1"
rudroid-android-elf-load = { path = "../../capability/android/elf_load", features = ["test-fixtures"] }
# Test-only: the ticket-81 rework's shared assembly/stub facilities. Never a
# production link (no descriptor, not a capability).
rudroid-test-support = { path = "../../test-support" }
# Creator-thread SDL event injection for opt-in production JNI input acceptance.
sdl2 = { version = "0.37", default-features = false }
# Test-only: the ticket-84 stats probe dlopens the deployed cdylib and reads
# rudroid_elf_load_stats (load-call counters).
libloading = "0.8"
# Historical Unity integration tests (startup overlays, Mono fixtures).
rudroid-unity-common = { path = "../../capability/unity/common" }
