[package]
name = "rudroid-unity-profile-6"
version = "0.0.0"
edition = "2021"
license-file.workspace = true
publish = false
description = "Unity 6 engine profile capability (Silksong path)"

[lib]
# Artifact name == capability id (file stem), like the C++ kit.
name = "unity_6"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rudroid-common = { path = "../../../common" }
rudroid-unity-player-lifecycle = { path = "../player_lifecycle" }
