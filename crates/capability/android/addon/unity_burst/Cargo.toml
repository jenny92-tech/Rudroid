[package]
name = "rudroid-android-addon-unity-burst"
version = "0.0.0"
edition = "2021"
license-file.workspace = true
publish = false
description = "Unity Burst guest mapping stub"

[lib]
# Artifact name == capability id (file stem), like the C++ kit.
name = "sdk_unity_burst"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rudroid-android-addon-after-unity-module = { path = "../after_unity_module" }
rudroid-common = { path = "../../../../common" }
